<!doctype html>
<html lang="ru">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Заправка в рейсе — интерактивный прототип
  </title>
  <style>
    :root {
        --brand: #ff6200;
        --ink: #000;
        --sub: #64748b;
        --bg: #f5f5f5;
        --ok: #16a34a;
        --ok-soft: #e8f7ee;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #e9ebef;
        font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
        color: var(--ink);
    }

    button, input {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    button:disabled {
        opacity: .46;
        cursor: not-allowed;
    }

    .phone {
        width: min(390px, 100%);
        height: min(844px, 100dvh);
        min-height: 640px;
        margin: 22px auto;
        border-radius: 36px;
        background: #fff;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 10px 30px #11182714;
    }

    .status {
        height: 47px;
        padding: 0 28px 8px;
        flex: none;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-size: 15px;
        font-weight: 600;
    }

    .app-body {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    #screen {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 4px 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .head {
        font-size: 28px;
        line-height: 1.14;
        font-weight: 700;
        margin: 4px 0 0;
        letter-spacing: -.4px;
    }

    .card {
        background: var(--bg);
        border-radius: 16px;
        padding: 16px;
    }

    .label, .muted {
        font-size: 12px;
        color: var(--sub);
    }

    .small {
        color: var(--sub);
        font-size: 12px;
        line-height: 1.5;
    }

    .route {
        font-size: 20px;
        font-weight: 600;
        margin: 7px 0 5px;
    }

    .sum {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -.5px;
        margin: 6px 0 1px;
    }

    .meter {
        height: 6px;
        background: #e3e6eb;
        border-radius: 3px;
        overflow: hidden;
        margin-top: 10px;
    }

    .meter i {
        display: block;
        height: 100%;
        background: var(--brand);
    }

    .btn {
        width: 100%;
        min-height: 54px;
        padding: 16px;
        background: var(--brand);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        text-align: center;
    }

    .btn.alt {
        background: #edf0f4;
        color: #243142;
    }

    .btn.danger {
        background: #fff0ec;
        color: #af380b;
    }

    .btn.outline {
        background: white;
        border: 1px solid #ccd4df;
        color: #344256;
    }

    .actions {
        display: grid;
        gap: 10px;
        margin-top: 18px;
    }

    .link {
        padding: 8px 0;
        background: transparent;
        border: 0;
        color: #b64c0b;
        font-size: 12px;
        text-align: left;
        font-weight: 600;
    }

    .limit-toggle { display: inline-flex; align-items: center; gap: 8px; }
    .limit-toggle span { font-size: 17px; font-weight: 600; }
    .limit-details { margin-top: 8px; border-top: 1px solid #e0e4e9; padding-top: 12px; }
    .limit-detail-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; font-size: 13px; }
    .limit-detail-row span { color: #64748b; }
    .limit-detail-row strong { font-weight: 650; white-space: nowrap; }
    .limit-details p { margin: 11px 0 0; color: #64748b; font-size: 12px; line-height: 1.55; }
    .limit-card .link {
        margin-top: 4px;
    }

    .screen-bottom {
        margin-top: auto;
        padding-top: 14px;
    }

    .secondary-actions {
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 10px;
    }

    .secondary-actions .btn {
        min-height: 45px;
        font-size: 13px;
        padding: 10px;
    }

    .secondary-actions .link {
        font-size: 11px;
    }

    .result-center {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 14px;
    }

    .okicon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--ok-soft);
        color: var(--ok);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        font-weight: 700;
    }

    .cancel-icon {
        background: #fff0e6;
        color: #bb4d0c;
    }

    .big {
        font-size: 24px;
        font-weight: 700;
    }

    .result-card {
        width: 100%;
        text-align: left;
    }

    .result-card .line {
        padding: 5px 0;
        margin: 3px 0;
        font-size: 14px;
    }

    .result-card .line span {
        color: var(--sub);
    }

    .result-card .line strong {
        font-weight: 500;
    }

    .receipt-note {
        line-height: 1.5;
    }

    .line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin: 10px 0;
        font-size: 14px;
    }

    .line strong {
        text-align: right;
    }

    .intro {
        margin: 0;
        font-size: 13px;
        color: var(--sub);
    }

    .choice {
        width: 100%;
        min-height: 65px;
        border: 2px solid #e2e8f0;
        background: white;
        border-radius: 15px;
        padding: 15px;
        text-align: left;
        margin: 0 0 10px;
    }

    .choice.chosen {
        border-color: var(--brand);
        background: #fff4ec;
    }

    .choice:disabled {
        background: #f1f2f4;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2,minmax(0,1fr));
        gap: 10px;
    }

    .grid .choice {
        margin: 0;
    }

    .field {
        width: 100%;
        min-height: 56px;
        border: 2px solid #dce2e9;
        border-radius: 14px;
        padding: 13px 15px;
        font-size: 22px;
        font-weight: 650;
    }

    .callout {
        border-left: 4px solid var(--brand);
        border-radius: 7px;
        background: #fff2e9;
        padding: 14px;
        font-size: 13px;
        line-height: 1.5;
    }

    .callout.warn {
        background: #fff7e8;
        border-left-color: #b45309;
    }

    .callout.error {
        background: #fff0ef;
        border-left-color: #db3b35;
    }

    .pill {
        display: inline-block;
        padding: 5px 9px;
        background: #eef3f8;
        border-radius: 25px;
        font-size: 12px;
    }

    .progress {
        height: 12px;
        border-radius: 10px;
        background: #e4e9ed;
        overflow: hidden;
        margin: 14px 0;
    }

    .progress i {
        display: block;
        height: 100%;
        background: var(--brand);
    }

    .bigcenter {
        text-align: center;
        padding: 18px 0 8px;
    }

    .symbol {
        font-size: 50px;
        margin-bottom: 10px;
    }

    .back {
        align-self: flex-start;
        border: 0;
        background: transparent;
        color: #bd4c00;
        font-size: 14px;
        font-weight: 700;
        padding: 4px 0 3px;
    }

    .debug-network {
        padding: 7px 24px;
        background: #fafafa;
        border-top: 1px solid #f1f1f1;
        color: #64748b;
        font-size: 11px;
    }

    .debug-network label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .debug-network input {
        accent-color: var(--brand);
    }

    .connectivity {
        font-size: 11px;
        color: var(--ok);
    }

    .connectivity.off {
        color: #c15300;
    }

    @media(max-width: 440px) { .phone { margin: 0 auto; width: 100%; height: 100dvh; border-radius: 0; } }

    .station-list {
        display: grid;
        gap: 12px;
        margin-top: 14px;
    }

    .station-card {
        width: 100%;
        border: 1px solid #dbe3ec;
        background: linear-gradient(180deg,#ffffff 0%,#fbfcfd 100%);
        border-radius: 18px;
        padding: 16px;
        text-align: left;
        box-shadow: 0 6px 16px rgba(17,24,39,.04);
        transition: transform .15s ease,box-shadow .15s ease,border-color .15s ease;
    }

    .station-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(17,24,39,.08);
        border-color: #cfd8e3;
    }

    .station-card:active {
        transform: scale(.995);
    }

    .station-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
    }

    .station-main {
        min-width: 0;
    }

    .station-name {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
        font-weight: 700;
        color: #0f172a;
    }

    .station-brand {
        display: inline-flex;
        align-items: center;
        margin-bottom: 8px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #fff2e8;
        color: #b45309;
        font-size: 11px;
        font-weight: 700;
    }

    .station-address {
        margin-top: 6px;
        font-size: 13px;
        line-height: 1.45;
        color: #64748b;
    }

    .station-arrow {
        flex: none;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #fff4ec;
        color: #d35400;
        font-size: 18px;
        font-weight: 700;
    }

    .station-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #edf2f7;
    }

    .station-distance {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: #eff4f8;
        color: #334155;
        font-size: 12px;
        font-weight: 600;
    }

    .station-price {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }

    .station-price-label {
        font-size: 11px;
        color: #64748b;
    }

    .station-price-value {
        font-size: 20px;
        line-height: 1;
        font-weight: 800;
        color: #0f172a;
    }

    .station-price-empty {
        font-size: 14px;
        font-weight: 700;
        color: #94a3b8;
    }

  </style>
 </head>
 <body>
  <div aria-label="Интерактивный прототип заправки" class="phone">
   <div class="status">
    <span>
     9:41
    </span>
    <span>
     ▮▮▮ ▭
    </span>
   </div>
   <div class="app-body">
    <main aria-live="polite" id="screen">
     <div class="head">
      Загружаем рейс…
     </div>
    </main>
   </div>
   <div class="debug-network">
    <label>
     <input id="offline-toggle" type="checkbox"/>
     Симулировать отсутствие связи
     <span class="connectivity" id="connectivity">
      Связь есть
     </span>
    </label>
   </div>
  </div>
  <script src="fake-api.js">
  </script>
  <script src="app.js">
  </script>
 </body>
</html>
